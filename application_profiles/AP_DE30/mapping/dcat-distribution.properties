# === DCAT Distribution ===
# Based on https://github.com/gdcc/exporter-dcat3/blob/c012a82e36c3de35f2bded2fbf1735a049214f8c/application_profiles/lightweight/mapping/dcat-distribution.properties
scope.json = $.datasetFileDetails[*]

# File IRI
subject.iri.format = https://health-study-hub.de/api/access/datafile/${value}
subject.iri.json   = $.id

# Access URL (IRI) from dataset persistent URL (root)
props.accessURL.predicate = dcat:accessURL
props.accessURL.as        = iri
props.accessURL.json      = $$.datasetJson.persistentUrl

# License from datasetVersion (if available)
props.license.predicate = dct:license
props.license.as        = node-ref
props.license.node      = license

nodes.license.kind     = iri
nodes.license.type     = dct:LicenseDocument
nodes.license.iri.json = $$.datasetJson.datasetVersion.license.uri

# Map Dataverse/Creative Commons URIs to DCAT-AP.de URIs
nodes.license.map.http\://creativecommons.org/publicdomain/zero/1.0 = http://dcat-ap.de/def/licenses/cc-zero
nodes.license.map.http\://creativecommons.org/licenses/by/4.0 = http://dcat-ap.de/def/licenses/cc-by/4.0
nodes.license.map.http\://creativecommons.org/licenses/by-sa/4.0 = http://dcat-ap.de/def/licenses/cc-by-sa/4.0
nodes.license.map.http\://creativecommons.org/licenses/by-nc/4.0 = http://dcat-ap.de/def/licenses/cc-by-nc/4.0

nodes.license.onUnMappedValue = http://dcat-ap.de/def/licenses/other-closed

# Title
props.title.predicate = dct:title
props.title.as        = literal
props.title.json      = $.filename

# Description
props.description.predicate = dct:description
props.description.as        = literal
props.description.lang      = en
props.description.json      = $.description

# Byte size ? xsd:integer (datatype IRI must be expanded by mapper)
props.byteSize.predicate = dcat:byteSize
props.byteSize.as        = literal
props.byteSize.datatype  = xsd:nonNegativeInteger
props.byteSize.json      = $.filesize

# Media type (IRI to IANA)
props.mediaType.predicate = dcat:mediaType
props.mediaType.as        = iri
props.mediaType.format    = http://www.iana.org/assignments/media-types/${value}
props.mediaType.json      = $.contentType

# SPDX checksum node with algorithm mapped from $.checksum.type
props.checksum.predicate = spdx:checksum
props.checksum.as        = node-ref
props.checksum.node      = checksum

nodes.checksum.kind = bnode
nodes.checksum.type = spdx:Checksum

nodes.checksum.props.algorithm.predicate = spdx:algorithm
nodes.checksum.props.algorithm.as        = iri
nodes.checksum.props.algorithm.json      = $.checksum.type
nodes.checksum.props.algorithm.map.MD5    = http://spdx.org/rdf/terms#checksumAlgorithm_md5
nodes.checksum.props.algorithm.map.SHA1   = http://spdx.org/rdf/terms#checksumAlgorithm_sha1
nodes.checksum.props.algorithm.map.SHA-1  = http://spdx.org/rdf/terms#checksumAlgorithm_sha1
nodes.checksum.props.algorithm.map.SHA224 = http://spdx.org/rdf/terms#checksumAlgorithm_sha224
nodes.checksum.props.algorithm.map.SHA-224= http://spdx.org/rdf/terms#checksumAlgorithm_sha224
nodes.checksum.props.algorithm.map.SHA256 = http://spdx.org/rdf/terms#checksumAlgorithm_sha256
nodes.checksum.props.algorithm.map.SHA-256= http://spdx.org/rdf/terms#checksumAlgorithm_sha256
nodes.checksum.props.algorithm.map.SHA512 = http://spdx.org/rdf/terms#checksumAlgorithm_sha512
nodes.checksum.props.algorithm.map.SHA-512= http://spdx.org/rdf/terms#checksumAlgorithm_sha512

nodes.checksum.props.checksumValue.predicate = spdx:checksumValue
nodes.checksum.props.checksumValue.as        = literal
nodes.checksum.props.checksumValue.datatype  = xsd:hexBinary
nodes.checksum.props.checksumValue.json      = $.checksum.value
